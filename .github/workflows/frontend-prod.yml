name: Frontend PROD

on:
  pull_request:
    branches:
      - prod
    types:
      - closed

permissions:
  contents: read

env:
  REGISTRY: docker.io
  IMAGE_NAME: jaffleman971/maptdp-frontend

jobs:

  validate-source:
    if: github.event.pull_request.merged == true

    runs-on: ubuntu-latest

    steps:
      - name: Validate source
        run: |
          SOURCE="${{ github.event.pull_request.head.ref }}"

          if [ "$SOURCE" != "staging" ]; then
            echo "Only staging can be merged into prod"
            exit 1
          fi

  prepare:
    if: github.event.pull_request.merged == true

    needs:
      - validate-source

    runs-on: ubuntu-latest

    outputs:
      sha: ${{ steps.sha.outputs.sha }}

    steps:
      - name: Extract SHA
        id: sha
        run: |
          echo "sha=$(echo "${{ github.event.pull_request.head.sha }}" | cut -c1-7)" >> $GITHUB_OUTPUT

  retag-staging:
    needs:
      - prepare
  
    runs-on: ubuntu-latest
  
    steps:
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
  
      - name: Pull dev image
        run: |
          docker pull \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-sha-${{ needs.prepare.outputs.sha }}
  
      - name: Tag staging image
        run: |
          docker tag \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-sha-${{ needs.prepare.outputs.sha }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ needs.prepare.outputs.sha }}
  
      - name: Push staging image
        run: |
          docker push \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ needs.prepare.outputs.sha }}

