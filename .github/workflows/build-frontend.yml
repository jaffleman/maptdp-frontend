name: Build & Push Frontend Image (Docker Hub)

on:
  push:
    branches: [ "main", "staging", "dev" ]

  pull_request:
    branches: [ "main", "staging", "dev" ]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: docker.io
  IMAGE_NAME: jaffleman971/maptdp-frontend

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ------------------------ CHECKOUT ------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------ SECRET SCAN ------------------------
      - name: Scan secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2

      # ------------------------ NODE ------------------------
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      # ------------------------ INSTALL & TEST ------------------------
      - name: Install dependencies & test
        run: |
          npm ci
          npm test --if-present -- --watchAll=false

      # ------------------------ BUILD ------------------------
      - name: Build frontend
        env:
          CI: "true"
        run: npm run build

      # ------------------------ DOCKER SETUP ------------------------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ------------------------ LOGIN DOCKER HUB ------------------------
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ------------------------ DOCKER METADATA ------------------------
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch

      # ------------------------ BUILD LOCAL IMAGE ------------------------
      - name: Build Docker image (local for scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: local-frontend:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ------------------------ TRIVY SCAN ------------------------
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: local-frontend:scan
          scanners: vuln
          vuln-type: library
          severity: CRITICAL,HIGH
          exit-code: 1

      # ------------------------ BUILD & PUSH ------------------------
      - name: Build and push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max