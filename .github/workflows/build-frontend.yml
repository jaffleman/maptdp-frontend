name: Backend CI/CD

on:
  push:
    branches: ["dev", "staging"]

permissions:
  contents: write
  pull-requests: write

env:
  REGISTRY: docker.io
  IMAGE_NAME: jaffleman971/maptdp-backend

jobs:

  # ✅ ---------------- BUILD IMAGE (DEV ONLY) ----------------
  build:
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.vars.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install & Test
        run: |
          npm ci
          npm test --if-present

      - name: Extract SHA
        id: vars
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          echo "sha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Generate tag
        id: tag
        run: |
          TAG="dev-sha-${GITHUB_SHA::7}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Login Docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}

  # ✅ ---------------- AUTO PR ----------------
  create-pr:
    if: github.ref_name == 'dev'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Create PR dev → staging
        uses: peter-evans/create-pull-request@v6
        with:
          branch: promote-dev-to-staging
          base: staging
          title: "Promote dev → staging"
          body: "Auto promotion after successful build ✅"
          commit-message: "Promote dev to staging"

  # ✅ ---------------- RETAG IMAGE (STAGING ONLY) ----------------
  retag:
    if: github.ref_name == 'staging'
    runs-on: ubuntu-latest

    steps:
      - name: Extract SHA
        id: vars
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          echo "sha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Login Docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull dev image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-sha-${{ steps.vars.outputs.sha }}

      - name: Retag image
        run: |
          docker tag \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-sha-${{ steps.vars.outputs.sha }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-sha-${{ steps.vars.outputs.sha }}

      - name: Push staging image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-sha-${{ steps.vars.outputs.sha }}